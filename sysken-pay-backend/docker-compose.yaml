services:
  sysken-pay:
    container_name: sysken-pay
    build:
      context: .
      dockerfile: ./Dockerfile
    volumes:
      - ./src:/go/src/app
      - go_modules:/go/pkg/mod
    ports:
      # 既定ではラズパイの中（localhost）からだけ届く。
      # フロントを別の PC で動かすときだけ、.env に API_BIND_ADDR=0.0.0.0 を書く
      - "${API_BIND_ADDR:-127.0.0.1}:${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    environment:
      - MYSQL_HOST=db
    tty: true
    restart: unless-stopped
    networks:
      - private-net
    depends_on:
      db:
        condition: service_healthy

  db:
    # バージョンを固定する。mysql:8 のままだと、ラズパイを作り直したときなどに知らないうちに新しいバージョンが入る。
    # 上げるときは、今のバージョンを docker exec sysken-db mysqld --version で確かめ、make backup を取ってから
    # ここを書き換えて docker compose up -d する（ラズパイでは main に入れて make deploy でもよい）。
    # 上げるのは 8.4.x の中だけにする。9.x などへ移すときは、先に MySQL の公式のアップグレード手順を確かめる
    image: mysql:8.4.13
    container_name: sysken-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Tokyo
    ports:
      # DB にはラズパイの中からだけ届くようにする
      - "127.0.0.1:53306:3306"
    restart: unless-stopped
    volumes:
      # DB のデータ本体。これが無いとコンテナを作り直したときに全データが消える
      - mysql_data:/var/lib/mysql
      # 最初の起動時（mysql_data が空のとき）だけ実行される
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - private-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  private-net:
    driver: bridge

volumes:
  mysql_data:
  go_modules:
