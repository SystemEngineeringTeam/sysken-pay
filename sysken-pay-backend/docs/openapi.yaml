openapi: "3.0.3"
info:
  title: Sysken Pay API
  description: 部内決済システム Sysken Pay のバックエンド API
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: ローカル開発環境

security: []

tags:
  - name: user
    description: ユーザー管理
  - name: charge
    description: チャージ管理
  - name: purchase
    description: 購入管理
  - name: balance
    description: 残高・履歴
  - name: item
    description: 商品管理
  - name: health
    description: ヘルスチェック
  - name: admin
    description: 管理者認証
  - name: payment-card
    description: 支払い用バーコード（スマホ支払い。設計は docs/phone-payment.md）

paths:
  # ==================== User ====================
  /v1/user:
    post:
      tags: [user]
      summary: ユーザー登録
      operationId: registerUser
      security:
        - adminBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUserRequest"
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostUserResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ユーザーIDが既に登録済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/user/{user_id}:
    get:
      tags: [user]
      summary: ユーザー取得
      operationId: getUser
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ユーザーが存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [user]
      summary: ユーザー更新
      operationId: updateUser
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchUserRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchUserResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== Charge ====================
  /v1/user/{user_id}/charge:
    post:
      tags: [charge]
      summary: チャージ
      operationId: chargeAmount
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostChargeRequest"
      responses:
        "201":
          description: チャージ成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargeResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/user/{user_id}/charge/cancel:
    post:
      tags: [charge]
      summary: チャージキャンセル
      operationId: chargeCancel
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostChargeCancelRequest"
      responses:
        "200":
          description: キャンセル成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargeCancelResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== Purchase ====================
  /v1/user/{user_id}/purchase:
    post:
      tags: [purchase]
      summary: 購入
      operationId: createPurchase
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostPurchaseRequest"
      responses:
        "201":
          description: 購入成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPurchaseResponse"
        "400":
          description: リクエスト不正、または残高不足（message が "insufficient balance"）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 購入対象の商品が存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/user/{user_id}/purchase/cancel:
    post:
      tags: [purchase]
      summary: 購入キャンセル
      operationId: cancelPurchase
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostPurchaseCancelRequest"
      responses:
        "200":
          description: キャンセル成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPurchaseCancelResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== Balance ====================
  /v1/user/{user_id}/balance:
    get:
      tags: [balance]
      summary: 残高取得
      operationId: getBalance
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBalanceResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/user/{user_id}/history:
    get:
      tags: [balance]
      summary: 購入履歴取得
      operationId: getPurchaseHistories
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: page
          in: query
          description: ページ番号
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: 1ページあたりの件数
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPurchaseHistoriesResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== Item ====================
  /v1/item:
    post:
      tags: [item]
      summary: 商品登録
      operationId: registerItem
      security:
        - adminBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostItemRequest"
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostItemResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [item]
      summary: 商品更新
      operationId: updateItem
      security:
        - adminBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchItemRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchItemResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [item]
      summary: 全商品取得
      operationId: getAllItems
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAllItemsResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/item/{jan_code}:
    get:
      tags: [item]
      summary: JANコードで商品取得
      operationId: getItemByJanCode
      parameters:
        - name: jan_code
          in: path
          required: true
          description: JANコード（8桁または13桁。チェックデジット検証あり。不正な場合は400を返す）
          schema:
            type: string
            pattern: "^[0-9]{8}$|^[0-9]{13}$"
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetItemResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 商品が存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== Payment Card ====================
  /v1/user/{user_id}/payment-card:
    post:
      tags: [payment-card]
      summary: 支払い用バーコードの発行（作り直し）
      description: |
        支払い用バーコードを発行する。すでに使えるものがあれば使えなくしてから新しく発行する（作り直し）。
        `code` はこのレスポンスでしか取り出せない（DB にはハッシュだけを保存する）。
      operationId: issuePaymentCard
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "201":
          description: 発行成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuePaymentCardResponse"
        "400":
          description: 学籍番号の形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: ユーザーが登録されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/payment-card/resolve:
    post:
      tags: [payment-card]
      summary: 支払い用バーコードの照合
      description: |
        読み取った支払い用バーコードから持ち主を返す。中身はアクセスログに残さないため、URL ではなく本文で送る。
        空白・ハイフン・小文字は取り除いてから照合する（4文字ずつ区切った表示を手で入力した場合のため）。
        短い時間に失敗が続くと、しばらく 429 を返す。
      operationId: resolvePaymentCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolvePaymentCardRequest"
      responses:
        "200":
          description: 照合成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvePaymentCardResponse"
        "400":
          description: 形式が不正（支払い用バーコードではない）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 存在しない、または使えなくなった支払い用バーコード
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: 失敗が続いたため、しばらく受け付けない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== Admin ====================
  /v1/admin/verify:
    get:
      tags: [admin]
      summary: 管理者パスワードの確認
      description: BASIC 認証が通れば 204 を返す。フロントのパスワード入力画面で、パスワードが正しいかを確かめるのに使う
      operationId: verifyAdmin
      security:
        - adminBasicAuth: []
      responses:
        "204":
          description: 認証成功
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ==================== Health ====================
  /v1/health:
    get:
      tags: [health]
      summary: ヘルスチェック
      operationId: healthCheck
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: "OK"

components:
  securitySchemes:
    adminBasicAuth:
      type: http
      scheme: basic
      description: |
        管理者パスワードによる BASIC 認証（ユーザー名は ADMIN_USER、既定 "admin"）。
        ユーザー登録・更新、商品登録・更新、チャージ、チャージ取消、購入取消で必要。

  responses:
    Unauthorized:
      description: 認証エラー（管理者パスワードが無い・違う）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      description: "ユーザーID（学籍番号フォーマット: 2桁の入学年度数字 + 1文字のアルファベット + 数字の連番）"
      schema:
        type: string
        pattern: "^[0-9]{2}[A-Za-z][0-9]+$"
        maxLength: 20
        example: "20K23099"

  schemas:
    # ==================== Request Schemas ====================
    PostUserRequest:
      type: object
      required: [user_id, user_name]
      properties:
        user_id:
          type: string
          pattern: "^[0-9]{2}[A-Za-z][0-9]+$"
          maxLength: 20
          example: "20K23099"
          description: "ユーザーID（学籍番号フォーマット: 2桁の入学年度数字 + 1文字のアルファベット + 数字の連番）"
        user_name:
          type: string
          minLength: 1
          maxLength: 50
          description: ユーザー名

    PatchUserRequest:
      type: object
      required: [user_name]
      properties:
        user_name:
          type: string
          minLength: 1
          maxLength: 50
          description: ユーザー名

    PostChargeRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          enum: [500, 1000, 2000]
          description: チャージ金額（500, 1000, 2000 のいずれか）

    PostChargeCancelRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          enum: [500, 1000, 2000]
          description: キャンセル金額（500, 1000, 2000 のいずれか）

    PostItemRequest:
      type: object
      required: [jan_code, item_name, price]
      properties:
        jan_code:
          type: string
          pattern: "^[0-9]{8}$|^[0-9]{13}$"
          description: JANコード（8桁または13桁）
        item_name:
          type: string
          minLength: 1
          description: 商品名
        price:
          type: integer
          minimum: 0
          description: 価格

    PatchItemRequest:
      type: object
      required: [jan_code, item_name, price]
      properties:
        jan_code:
          type: string
          pattern: "^[0-9]{8}$|^[0-9]{13}$"
          description: JANコード（8桁または13桁）
        item_name:
          type: string
          minLength: 1
          description: 商品名
        price:
          type: integer
          minimum: 0
          description: 価格

    PurchaseItem:
      type: object
      required: [item_id, quantity]
      properties:
        item_id:
          type: integer
          minimum: 1
          description: 商品ID
        quantity:
          type: integer
          minimum: 1
          description: 数量

    PostPurchaseRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PurchaseItem"

    PostPurchaseCancelRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PurchaseItem"

    # ==================== Response Schemas ====================
    PostUserResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        user_id:
          type: string
        user_name:
          type: string
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"

    GetUserResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        user_id:
          type: string
        user_name:
          type: string
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"

    PatchUserResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        user_id:
          type: string
        user_name:
          type: string
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"

    ChargeResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        charge_id:
          type: integer
        charge_amount:
          type: integer
        user_id:
          type: string
        balance:
          type: integer
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"

    ChargeCancelResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        charge_id:
          type: integer
        canceled_amount:
          type: integer
        user_id:
          type: string
        balance:
          type: integer
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"

    PostItemResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        id:
          type: integer
        jan_code:
          type: string
        item_name:
          type: string
        price:
          type: integer
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"
        updated_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"

    PatchItemResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        id:
          type: integer
        jan_code:
          type: string
        item_name:
          type: string
        price:
          type: integer
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"
        updated_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"

    GetItemResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        item_id:
          type: integer
        jan_code:
          type: string
        item_name:
          type: string
        price:
          type: integer

    GetAllItemsResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        items:
          type: array
          items:
            type: object
            properties:
              item_id:
                type: integer
              jan_code:
                type: string
              item_name:
                type: string
              price:
                type: integer

    PostPurchaseResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        balance:
          type: integer
          description: 残金
        user_id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseItem"

    PostPurchaseCancelResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        id:
          type: integer
        user_id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseItem"
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"

    GetBalanceResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        user_id:
          type: string
        balance:
          type: integer

    HistoryItem:
      type: object
      properties:
        item_name:
          type: string
        quantity:
          type: integer
        price:
          type: integer
        purchase_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"

    PageInfo:
      type: object
      properties:
        prev_page:
          type: integer
          nullable: true
          description: 前のページ番号（存在しない場合は省略）
        next_page:
          type: integer
          nullable: true
          description: 次のページ番号（存在しない場合は省略）
        total_page:
          type: integer
          description: 総ページ数

    GetPurchaseHistoriesResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        histories:
          type: array
          items:
            $ref: "#/components/schemas/HistoryItem"
        total:
          type: integer
          description: 合計金額
        page:
          $ref: "#/components/schemas/PageInfo"

    IssuePaymentCardResponse:
      type: object
      required: [status, user_id, user_name, code, display_code]
      properties:
        status:
          type: string
          example: "success"
        user_id:
          type: string
          example: "24K01234"
        user_name:
          type: string
          example: "シス研太郎"
        code:
          type: string
          description: 支払い用バーコードの中身（SP + 16文字）。このレスポンスでしか取り出せない
          example: "SP7Q2KX9MDRA4TW8YZ"
        display_code:
          type: string
          description: 画面に出す見やすい形
          example: "SP 7Q2K X9MD RA4T W8YZ"

    ResolvePaymentCardRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 読み取った支払い用バーコード
          example: "SP7Q2KX9MDRA4TW8YZ"

    ResolvePaymentCardResponse:
      type: object
      required: [status, user_id, user_name]
      properties:
        status:
          type: string
          example: "success"
        user_id:
          type: string
          example: "24K01234"
        user_name:
          type: string
          example: "シス研太郎"

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: "error"
        message:
          type: string
          description: エラーメッセージ
