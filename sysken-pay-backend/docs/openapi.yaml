openapi: "3.0.3"
info:
  title: Sysken Pay API
  description: 部内決済システム Sysken Pay のバックエンド API
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: ローカル開発環境

security: []

tags:
  - name: user
    description: ユーザー管理
  - name: charge
    description: チャージ管理
  - name: purchase
    description: 購入管理
  - name: balance
    description: 残高・履歴
  - name: item
    description: 商品管理
  - name: health
    description: ヘルスチェック
  - name: admin
    description: 管理者認証

paths:
  # ==================== User ====================
  /v1/user:
    get:
      tags: [member]
      summary: ユーザー一覧（止めた人も含む）／HRI の持ち主の照合
      description: |
        **`hri` を付けない場合（管理者パスワードが必要）**
        管理者画面のユーザー一覧。残高・状態（使える／利用停止）・未返金か・卒業候補かを返す。
        卒業候補は、使える人のうち入学（学籍番号のアルファベットの後ろ2桁）から4年以上たった人。自動では止めない。

        **`hri` を付ける場合（認証なし）**
        読み取った HRI（支払い用バーコードの文字列）から持ち主を返す（支払い・チャージ）。
        空白・ハイフン・小文字は取り除いてから照合する（4文字ずつ区切った表示を手で入力した場合のため）。
        短い時間に失敗が続くと、しばらく 429 を返す。
        **HRI は URL に載るので、API の前にリバースプロキシを置くときは、アクセスログにクエリを残さないこと。**
      operationId: listMembers
      security:
        - adminBasicAuth: []
        - {}
      parameters:
        - name: hri
          in: query
          required: false
          description: 読み取った HRI。付けると照合になる（認証なし）
          schema:
            type: string
            example: "SP7Q2KX9MDRA4TW8YZ"
      responses:
        "200":
          description: 取得成功（`hri` なら ResolveHriResponse、なしなら ListMembersResponse）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ListMembersResponse"
                  - $ref: "#/components/schemas/ResolveHriResponse"
        "400":
          description: （hri） 形式が不正（HRI ではない）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: （hri） 利用停止した人の HRI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: （hri） 存在しない、または使えなくなった HRI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: （hri） 失敗が続いたため、しばらく受け付けない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [user]
      summary: ユーザー登録
      operationId: registerUser
      security:
        - adminBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUserRequest"
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostUserResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ユーザーIDが既に登録済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/user/{user_id}:
    get:
      tags: [user]
      summary: ユーザー取得
      operationId: getUser
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 利用停止している（退部・卒業）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ユーザーが存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [user]
      summary: ユーザー更新
      operationId: updateUser
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchUserRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchUserResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: ユーザーが登録されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 新しい学籍番号がもう使われている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [member]
      summary: 停止中の人の削除
      description: |
        停止中で、購入・チャージ・返金の記録が1件もない人（登録ミス・テストで作った人）だけを消す。
        その人の行と、支払い用バーコード・発行用 QR の行を消す。**取り消せない**。
        記録が1件でもある人は消さない（会計の記録を残すため）。その人は非表示にする。
      operationId: deleteMember
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDoneResponse"
        "400":
          description: 学籍番号の形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: ユーザーが登録されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 利用停止していない・購入／チャージ／返金の記録がある
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== Charge ====================
  /v1/user/{user_id}/charge:
    post:
      tags: [charge]
      summary: チャージ
      operationId: chargeAmount
      # チャージ用パスワード（CHARGE_PASSWORD）でも管理者パスワードでも通る
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostChargeRequest"
      responses:
        "201":
          description: チャージ成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargeResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 利用停止している（退部・卒業）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/user/{user_id}/charge/cancel:
    post:
      tags: [charge]
      summary: チャージキャンセル
      operationId: chargeCancel
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostChargeCancelRequest"
      responses:
        "200":
          description: キャンセル成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargeCancelResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== Purchase ====================
  /v1/user/{user_id}/purchase:
    post:
      tags: [purchase]
      summary: 購入
      operationId: createPurchase
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostPurchaseRequest"
      responses:
        "201":
          description: 購入成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPurchaseResponse"
        "400":
          description: リクエスト不正、または残高不足（message が "insufficient balance"）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 利用停止している（退部・卒業）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 購入対象の商品が存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/user/{user_id}/purchase/cancel:
    post:
      tags: [purchase]
      summary: 購入キャンセル
      operationId: cancelPurchase
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostPurchaseCancelRequest"
      responses:
        "200":
          description: キャンセル成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPurchaseCancelResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== Balance ====================
  /v1/user/{user_id}/balance:
    get:
      tags: [balance]
      summary: 残高取得
      operationId: getBalance
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBalanceResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/user/{user_id}/history:
    get:
      tags: [balance]
      summary: 購入履歴取得
      operationId: getPurchaseHistories
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: page
          in: query
          description: ページ番号
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: 1ページあたりの件数
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPurchaseHistoriesResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== Item ====================
  /v1/item:
    post:
      tags: [item]
      summary: 商品登録
      operationId: registerItem
      security:
        - adminBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostItemRequest"
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostItemResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [item]
      summary: 商品更新
      operationId: updateItem
      security:
        - adminBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchItemRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchItemResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [item]
      summary: 全商品取得
      description: 既定では有効な商品だけを返す（キオスクの一覧用）。`include_disabled=true` で無効の商品も返す
      operationId: getAllItems
      parameters:
        - name: include_disabled
          in: query
          required: false
          description: true なら無効の商品も含める
          schema:
            type: boolean
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAllItemsResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/item/{jan_code}:
    get:
      tags: [item]
      summary: JANコードで商品取得
      description: |
        無効の商品も 200 で返し、`disabled: true` で区別する（未登録の 404 とは別）。
        無効の商品は購入できない。
      operationId: getItemByJanCode
      parameters:
        - name: jan_code
          in: path
          required: true
          description: JANコード（8桁または13桁。チェックデジット検証あり。不正な場合は400を返す）
          schema:
            type: string
            pattern: "^[0-9]{8}$|^[0-9]{13}$"
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetItemResponse"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 商品が存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/item/{jan_code}/disable:
    post:
      tags: [item]
      summary: 商品を無効にする（買えなくする）
      description: 商品は消さない。`enable` でいつでも有効に戻せる。
      operationId: disableItem
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/JanCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetItemDisabledResponse"
        "400":
          description: JANコードの形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 商品が登録されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: すでに無効になっている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/item/{jan_code}/enable:
    post:
      tags: [item]
      summary: 無効の商品を有効に戻す
      operationId: enableItem
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/JanCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetItemDisabledResponse"
        "400":
          description: JANコードの形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 商品が登録されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 無効になっていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== Payment Card ====================
  /v1/user/{user_id}/hri:
    post:
      tags: [user]
      summary: HRI（支払い用バーコードの文字列）の発行（作り直し）
      description: |
        HRI（`SP` + 16文字）を発行する。すでに使えるものがあれば使えなくしてから新しく発行する（作り直し）。
        `hri` はこのレスポンスでしか取り出せない（DB にはハッシュだけを保存する）。
        スマホ登録の QR は、フロントがこの `hri` を静的サイト（sysken-pay-qr）の URL の `#a=` に入れて作る。
      operationId: issueHri
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "201":
          description: 発行成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueHriResponse"
        "400":
          description: 学籍番号の形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 利用停止している（退部・卒業）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ユーザーが登録されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/user/{user_id}/refund:
    post:
      tags: [member]
      summary: 返金（残高ちょうど）
      description: |
        残高ちょうどを現金で返したことを記録し、残高を 0 にする。止めた人にもできる。
      operationId: refundMember
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundResponse"
        "400":
          description: 学籍番号の形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: ユーザーが登録されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 残高が 0 で返金するものがない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/user/{user_id}/stop:
    post:
      tags: [member]
      summary: 利用停止
      description: |
        支払い用バーコードを使えなくして、利用停止にする。残高は残す（返金は別の操作）。
      operationId: stopMember
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopMemberResponse"
        "400":
          description: 学籍番号の形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: ユーザーが登録されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: すでに利用停止している
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/user/{user_id}/resume:
    post:
      tags: [member]
      summary: 利用停止の解除
      description: |
        利用停止を解除する（再入部など）。このあと支払い用バーコードを発行し直す。
      operationId: resumeMember
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeMemberResponse"
        "400":
          description: 学籍番号の形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: ユーザーが登録されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 利用停止していない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/user/{user_id}/hide:
    post:
      tags: [member]
      summary: 停止中の人を一覧から非表示にする
      description: |
        停止中で、残高が 0 の人を一覧から隠す。記録は何も消さない。
        残高が残っている人（未返金）は非表示にできない（先に返金する）。
      operationId: hideMember
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDoneResponse"
        "400":
          description: 学籍番号の形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: ユーザーが登録されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 利用停止していない・残高が残っている・すでに非表示
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/user/{user_id}/unhide:
    post:
      tags: [member]
      summary: 非表示の解除
      description: |
        非表示にした人を、停止中の一覧に戻す。
      operationId: unhideMember
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDoneResponse"
        "400":
          description: 学籍番号の形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: ユーザーが登録されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 非表示にしていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/verify:
    get:
      tags: [admin]
      summary: 管理者パスワードの確認
      description: BASIC 認証が通れば 204 を返す。フロントのパスワード入力画面で、パスワードが正しいかを確かめるのに使う
      operationId: verifyAdmin
      security:
        - adminBasicAuth: []
      responses:
        "204":
          description: 認証成功
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/charge/verify:
    get:
      tags: [admin]
      summary: チャージの画面のパスワードの確認
      description: |
        チャージ用パスワード（CHARGE_PASSWORD）か管理者パスワードで BASIC 認証が通れば 204 を返す。
        チャージ用パスワードでできるのは、チャージ（POST /v1/user/{user_id}/charge）だけ
      operationId: verifyCharge
      security:
        - adminBasicAuth: []
      responses:
        "204":
          description: 認証成功
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ==================== Health ====================
  /v1/health:
    get:
      tags: [health]
      summary: ヘルスチェック（DB につながっているかまで確かめる）
      description: |
        API が動いていて、DB に（2 秒以内に）つながれば 200。DB につながらないときは 503。
        503 の本文は "NG" だけで、DB のエラーの中身は返さない（ログに残る）。
      operationId: healthCheck
      responses:
        "200":
          description: OK（API も DB も動いている）
          content:
            text/plain:
              schema:
                type: string
                example: "OK"
        "503":
          description: DB につながらない
          content:
            text/plain:
              schema:
                type: string
                example: "NG"

components:
  securitySchemes:
    adminBasicAuth:
      type: http
      scheme: basic
      description: |
        管理者パスワードによる BASIC 認証（ユーザー名は ADMIN_USER、既定 "admin"）。
        ユーザー登録・更新、商品登録・更新、チャージ、チャージ取消、購入取消で必要。

  responses:
    Unauthorized:
      description: 認証エラー（管理者パスワードが無い・違う）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      description: "ユーザーID（学籍番号フォーマット: 2桁の入学年度数字 + 1文字のアルファベット + 数字の連番）"
      schema:
        type: string
        pattern: "^[0-9]{2}[A-Za-z][0-9]+$"
        maxLength: 20
        example: "20K23099"
    JanCode:
      name: jan_code
      in: path
      required: true
      description: JANコード（8桁または13桁。チェックデジット検証あり。不正な場合は400を返す）
      schema:
        type: string
        pattern: "^[0-9]{8}$|^[0-9]{13}$"

  schemas:
    # ==================== Request Schemas ====================
    PostUserRequest:
      type: object
      required: [user_id, user_name]
      properties:
        user_id:
          type: string
          pattern: "^[0-9]{2}[A-Za-z][0-9]+$"
          maxLength: 20
          example: "20K23099"
          description: "ユーザーID（学籍番号フォーマット: 2桁の入学年度数字 + 1文字のアルファベット + 数字の連番）"
        user_name:
          type: string
          minLength: 1
          maxLength: 50
          description: ユーザー名

    PatchUserRequest:
      type: object
      required: [user_name]
      properties:
        user_id:
          type: string
          maxLength: 20
          description: |
            新しい学籍番号（登録のときの打ち間違いを直すときだけ入れる）。
            チャージ・購入・残高・返金・支払い用バーコードの記録も新しい学籍番号に付け替える
          example: 20K23099
        user_name:
          type: string
          minLength: 1
          maxLength: 50
          description: ユーザー名

    PostChargeRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          enum: [500, 1000, 2000]
          description: チャージ金額（500, 1000, 2000 のいずれか）

    PostChargeCancelRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          enum: [500, 1000, 2000]
          description: キャンセル金額（500, 1000, 2000 のいずれか）

    PostItemRequest:
      type: object
      required: [jan_code, item_name, price]
      properties:
        jan_code:
          type: string
          pattern: "^[0-9]{8}$|^[0-9]{13}$"
          description: JANコード（8桁または13桁）
        item_name:
          type: string
          minLength: 1
          description: 商品名
        price:
          type: integer
          minimum: 0
          description: 価格

    PatchItemRequest:
      type: object
      required: [jan_code, item_name, price]
      properties:
        jan_code:
          type: string
          pattern: "^[0-9]{8}$|^[0-9]{13}$"
          description: JANコード（8桁または13桁）
        item_name:
          type: string
          minLength: 1
          description: 商品名
        price:
          type: integer
          minimum: 0
          description: 価格

    PurchaseItem:
      type: object
      required: [item_id, quantity]
      properties:
        item_id:
          type: integer
          minimum: 1
          description: 商品ID
        quantity:
          type: integer
          minimum: 1
          description: 数量

    PostPurchaseRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PurchaseItem"

    PostPurchaseCancelRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PurchaseItem"

    # ==================== Response Schemas ====================
    PostUserResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        user_id:
          type: string
        user_name:
          type: string
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"

    GetUserResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        user_id:
          type: string
        user_name:
          type: string
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"

    PatchUserResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        user_id:
          type: string
        user_name:
          type: string
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"

    ChargeResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        charge_id:
          type: integer
        charge_amount:
          type: integer
        user_id:
          type: string
        balance:
          type: integer
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"

    ChargeCancelResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        charge_id:
          type: integer
        canceled_amount:
          type: integer
        user_id:
          type: string
        balance:
          type: integer
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"

    PostItemResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        id:
          type: integer
        jan_code:
          type: string
        item_name:
          type: string
        price:
          type: integer
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"
        updated_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"

    PatchItemResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        id:
          type: integer
        jan_code:
          type: string
        item_name:
          type: string
        price:
          type: integer
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"
        updated_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"

    GetItemResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        item_id:
          type: integer
        jan_code:
          type: string
        item_name:
          type: string
        price:
          type: integer
        disabled:
          type: boolean
          description: true なら無効の商品（買えない）。購入 API は 404 で断る

    SetItemDisabledResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        jan_code:
          type: string
        disabled:
          type: boolean
          description: 操作したあとの状態（無効にしたら true、有効に戻したら false）

    GetAllItemsResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        items:
          type: array
          items:
            type: object
            properties:
              item_id:
                type: integer
              jan_code:
                type: string
              item_name:
                type: string
              price:
                type: integer
              disabled:
                type: boolean

    PostPurchaseResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        balance:
          type: integer
          description: 残金
        user_id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseItem"

    PostPurchaseCancelResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        id:
          type: integer
        user_id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseItem"
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"

    GetBalanceResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        user_id:
          type: string
        balance:
          type: integer

    HistoryItem:
      type: object
      properties:
        item_name:
          type: string
        quantity:
          type: integer
        price:
          type: integer
        purchase_at:
          type: string
          format: date-time
          example: "2025-01-01T09:00:00.000+09:00"

    PageInfo:
      type: object
      properties:
        prev_page:
          type: integer
          nullable: true
          description: 前のページ番号（存在しない場合は省略）
        next_page:
          type: integer
          nullable: true
          description: 次のページ番号（存在しない場合は省略）
        total_page:
          type: integer
          description: 総ページ数

    GetPurchaseHistoriesResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        histories:
          type: array
          items:
            $ref: "#/components/schemas/HistoryItem"
        total:
          type: integer
          description: 合計金額
        page:
          $ref: "#/components/schemas/PageInfo"

    IssueHriResponse:
      type: object
      required: [status, user_id, user_name, hri, display_hri]
      properties:
        status:
          type: string
          example: "success"
        user_id:
          type: string
          example: "24K01234"
        user_name:
          type: string
          example: "シス研太郎"
        hri:
          type: string
          description: HRI（支払い用バーコードの文字列。SP + 16文字）。このレスポンスでしか取り出せない
          example: "SP7Q2KX9MDRA4TW8YZ"
        display_hri:
          type: string
          description: 画面に出す見やすい形
          example: "SP 7Q2K X9MD RA4T W8YZ"

    ListMembersResponse:
      type: object
      required: [status, users]
      properties:
        status:
          type: string
          example: success
        users:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    Member:
      type: object
      required: [user_id, user_name, balance, status, stopped_at, has_payment_card, unrefunded, graduation_candidate, hidden, deletable]
      properties:
        user_id:
          type: string
          example: 22K01234
        user_name:
          type: string
          example: k22000_yamadataro
        balance:
          type: integer
          example: 300
        status:
          type: string
          enum: [active, stopped]
          description: active＝使える、stopped＝利用停止
        stopped_at:
          type: string
          nullable: true
          description: 利用停止した日時。使える人は null
        has_payment_card:
          type: boolean
          description: 使える支払い用バーコードがあるか
        unrefunded:
          type: boolean
          description: 止めたのに残高が残っている（まだ返金していない）か
        graduation_candidate:
          type: boolean
          description: 年度末の卒業候補か（使える人のうち、入学から4年以上たった人）
        hidden:
          type: boolean
          description: 一覧から非表示にした人か（停止中で残高 0 の人だけがなれる）
        deletable:
          type: boolean
          description: 削除できる人か（停止中で、購入・チャージ・返金の記録が1件もない）
    RefundResponse:
      type: object
      required: [status, user_id, refunded_amount]
      properties:
        status:
          type: string
          example: success
        user_id:
          type: string
        refunded_amount:
          type: integer
          description: 返した額（残高ちょうど）
    StopMemberResponse:
      type: object
      required: [status, user_id, balance]
      properties:
        status:
          type: string
          example: success
        user_id:
          type: string
        balance:
          type: integer
          description: 止めたあとに残っている残高
    ResumeMemberResponse:
      type: object
      required: [status, user_id]
      properties:
        status:
          type: string
          example: success
        user_id:
          type: string
    MemberDoneResponse:
      type: object
      required: [status, user_id]
      properties:
        status:
          type: string
          example: success
        user_id:
          type: string
    ResolveHriResponse:
      type: object
      required: [status, user_id, user_name]
      properties:
        status:
          type: string
          example: "success"
        user_id:
          type: string
          example: "24K01234"
        user_name:
          type: string
          example: "シス研太郎"

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: "error"
        message:
          type: string
          description: エラーメッセージ
